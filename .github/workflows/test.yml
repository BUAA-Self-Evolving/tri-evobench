name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked test environment
        run: uv sync --frozen --group dev
      - name: Compile
        run: uv run --frozen python -m compileall -q trievo_bench baseline/adapters tools tests
      - name: Unit tests
        run: uv run --frozen python -m pytest tests -q
