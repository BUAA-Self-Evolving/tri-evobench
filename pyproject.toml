[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trievo-bench"
version = "0.1.0"
description = "Specification-driven runtime for a self-evolution agent benchmark"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[project.scripts]
trievo-bench = "trievo_bench.runner:main"

[tool.setuptools.packages.find]
include = ["trievo_bench*"]

[tool.setuptools.package-data]
"trievo_bench.baselines" = ["manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
